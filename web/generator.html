<!doctype html>
<html lang="en">
<head>
<base href="../">
{{head}}
<title>{{name}} · Print generators</title>
<meta name="description" content="{{description}}">
</head>
<body>
{{header}}
<main>
  <div class="page-title"><h1>{{name}}</h1><a class="btn" id="edit-lab" href="lab.html?recipe={{id}}" title="Change how this generator works (with an AI chat or by hand) and preview the result before publishing">Change this generator</a></div>
  <div id="app" data-recipe="{{id}}"></div>
</main>
<script type="module">
  import { mountGenerator } from './app/generator.js';
  import { loadRecipe } from './app/env.js';
  const root = document.getElementById('app');
  // carry the current settings into the lab
  document.getElementById('edit-lab').addEventListener('click', (e) => { e.currentTarget.href = `lab.html?recipe=${root.dataset.recipe}${location.hash}`; });
  try {
    window.generator = await mountGenerator(root, await loadRecipe(root.dataset.recipe));
  } catch (e) {
    root.append(Object.assign(document.createElement('pre'), { className: 'fatal', textContent: e.message }));
    throw e;
  }
</script>
</body>
</html>
