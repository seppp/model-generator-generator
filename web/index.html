<!doctype html>
<html lang="en">
<head>
{{head}}
<title>Generator Generator</title>
<meta name="description" content="Parametric 3D-print generators that run in your browser, and the generator that makes them.">
</head>
<body>
{{header}}
<main class="gg">
  <p class="tagline">We heard you like generators, so we put a generator in your generator. Pick one, tune it, download STL, multi-color 3MF or Onshape FeatureScript. Everything is computed in your browser.</p>
  <nav class="picker" id="picker" aria-label="Generators"></nav>
  <div class="page-title">
    <h1 id="title"></h1>
    <label class="pick" id="start-wrap" hidden>Start from <select id="start" aria-label="Start from"></select></label>
  </div>
  <div id="workbench"></div>
</main>
<script type="module" src="app/main.js"></script>
</body>
</html>
